<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Замер</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0 auto; max-width:480px; background:#000; color:#fff;
  /* Подняли таймер на 10px (было 80px) */
  padding:calc(env(safe-area-inset-top) + 70px) 16px 20px;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.form-container {
  /* Уменьшили высоту, так как поля стали тоньше */
  min-height: 340px; 
}

#krsFields {
  /* Оставляем отступ для КРС (место под круг уже зарезервировано в HTML) */
  margin-top: 20px;  
}

#katFields {
  margin-top: 20px; 
}  

/* Таймеры */
.disp{
  font-size:72px; text-align:center; color:#fff; font-variant-numeric:tabular-nums; 
  line-height:1.1; margin-top:8px; font-weight:400;
  transition: font-size 0.3s ease; /* Добавили плавность */
}

/* Класс для уменьшения главного таймера при появлении круга */
.disp.shrink {
  font-size: 48px; 
}

/* Таймер круга — ровно 27px по ТЗ */
.disp-lap{
  font-size:27px; text-align:left; color:#fff; font-variant-numeric:tabular-nums; 
  line-height:1.1; margin-left:10px; margin-top:4px; font-weight:300;
}

/* Верхние табы */
.tabs{
  position:fixed; top:0; left:0; right:0; max-width:480px; margin:0 auto;
  display:flex; z-index:10; padding:4px; background:#222; border-radius:999px;
  width:92%; box-sizing:border-box; 
  /* Подняли табы на 4px (было 10px) */
  margin-top:calc(env(safe-area-inset-top) + 6px);
}

.tab{
  flex:1; padding:12px; background:#082626; color:#fff; border:0; border-radius:999px;
  font-size:16px; font-family:inherit; font-weight:normal; text-align:center; transition:0.2s;
}
.tab.on.krs { background:#003c61; }
.tab.on.kat { background:#255010; }

/* Плашка блокировки */
#lockBar{display:none;background:#590d0b;color:#fff;text-align:center;padding:10px;border-radius:8px;margin-bottom:12px;font-size:14px}

/* Сетка 2х2 */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}

/* Подписи */
.row-label{font-size:12px;margin:0 0 6px 4px;color:#aaa;text-align:left;display:block}

/* Поля ввода */
input,textarea{
  background:#333333; color:#fff; border:0; border-radius:8px;
  padding:12px; font-size:16px; font-family:inherit; text-align:center;
  width:100%; box-sizing:border-box; 
  height:42px; /* Уменьшили с 44px */
}
textarea{text-align:left; resize:none; height:auto; min-height:60px}
input.err{background:#590d0b}

/* Переключатели (Контур, Осмотр) - Мини-табы */
.toggles{
  display:flex; background:#222; border-radius:999px; padding:3px; 
  height:42px; /* Уменьшили с 44px */
  box-sizing:border-box
}
.tg{
  flex:1; background:#082626; color:#fff; border:0; border-radius:999px;
  font-size:12px; font-weight:normal; text-align:center; font-family:inherit;
  transition:0.2s; padding:0; display:flex; align-items:center; justify-content:center;
}
.tg.on{background:#003c61}

/* Чеки (Печать/Выдача) - чтобы не ломали капсулу */
#katFields .toggles { background:transparent; padding:0; gap:8px; height:auto; }
#katFields .tg { background:#222; padding:10px; border-radius:8px; height:42px; } /* Уменьшили с 44px */
#katFields .tg.on { background:#005a8d; }

/* Кнопки действий */
.btns{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
.btn{
  padding:20px 6px; border:0; border-radius:999px; font-size:22px;
  font-family:inherit; font-weight:500; letter-spacing:0.5px;
}
#bStart{background:#132914;color:#0f0}
#bLap{background:#1e2b32;color:#00c8ff}
#bExport{background:#262626;color:#fff}
#bStop{background:#2c122a;color:#ff01ed}

/* Подсказки */
.hint{display:none;color:#ff6b6b;font-size:11px;margin-top:4px}
.suggest{max-height:150px;overflow:auto;border-radius:6px;margin-top:2px}
.suggest div{background:#262626;padding:10px;text-align:center;border-bottom:1px solid #000}
#status{text-align:center;color:#8a8a8a;font-size:13px;margin-top:12px;min-height:16px}
</style>
</head>
<body>

<script>
window.onerror = function (msg, src, line) {
  var s = document.getElementById('status');
  if (s) s.textContent = 'ОШИБКА JS: ' + msg + ' (строка ' + line + ')';
};
</script>

<div class="tabs">
  <button class="tab on krs" id="tabKrs" onclick="switchMode('krs')">КРС</button>
  <button class="tab kat" id="tabKat" onclick="switchMode('kat')">КЕЙТЕРИНГ</button>
</div>

<div id="lockBar">Записи заблокированы администратором</div>

<div id="main" class="disp">0:00:00</div>
<div id="lapWrap" style="visibility: hidden; height: 32px; margin-top: 4px;">
  <span class="row-label">Круг:</span>
  <div id="lap" class="disp-lap">0:00:00</div>
</div>

<div class="form-container">
  
  <!-- ================= ВКЛАДКА КРС ================= -->
  <div id="krsFields">
    <!-- Ряд 1: Номер входной и Номер манишки -->
    <div class="grid-2">
      <div>
        <div class="row-label">Номер входной</div>
        <input id="entry" inputmode="numeric" maxlength="17" oninput="entryInput()">
      </div>
      <div>
        <div class="row-label">Номер манишки</div>
        <input id="bib" inputmode="numeric" maxlength="4" oninput="digits(this,4)">
      </div>
    </div>

    <!-- Ряд 2: Тип контура и Тип осмотра -->
    <div class="grid-2" style="margin-top: 14px;">
      <div>
        <div class="row-label">Тип контура</div>
        <div class="toggles" data-group="kontur">
          <button class="tg" data-val="Теплый" onclick="pick(this)">Тёплый</button>
          <button class="tg" data-val="Холодный" onclick="pick(this)">Холод.</button>
        </div>
      </div>
      <div>
        <div class="row-label">Тип осмотра</div>
        <div class="toggles" data-group="osmotr">
          <button class="tg" data-val="Тело" onclick="pick(this)">Тело</button>
          <button class="tg" data-val="Ручная кладь" onclick="pick(this)">Кладь</button>
        </div>
      </div>
    </div> <!-- ВАЖНО: Вот этот тег у тебя потерялся -->

    <!-- Ряд 3: Примечание -->
    <div class="row-label" style="margin-top: 14px;">Примечание</div>
    <textarea id="noteK" rows="2" maxlength="300"></textarea>
  </div>

  <!-- ================= ВКЛАДКА КЕЙТЕРИНГ ================= -->
  <div id="katFields" style="display:none">
    <div class="grid-2">
      <div>
        <div class="row-label">Номер точки</div>
        <input id="point" autocomplete="off" oninput="pointInput()">
        <div id="pointList" class="suggest"></div>
        <div class="hint" id="latinHint">Используй латиницу!</div>
      </div>
      <div>
        <div class="row-label">Номер кассы</div>
        <input id="kassa" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <div class="row-label">Количество работающих касс</div>
        <input id="kassCount" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
      </div>
      <div>
        <div class="row-label">Количество работающих персонала</div>
        <input id="staff" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <div class="row-label">Чеки</div>
        <div class="toggles">
          <button class="tg" id="chkPrint" onclick="this.classList.toggle('on')">Печать</button>
          <button class="tg" id="chkIssue" onclick="this.classList.toggle('on')">Выдача</button>
        </div>
      </div>
      <div>
        <div class="row-label">Человек в очереди</div>
        <input id="queue" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
      </div>
    </div>

    <div class="row-label" style="margin-top:8px;">Примечание</div>
    <textarea id="noteKt" rows="2" maxlength="400"></textarea>
  </div>

</div> 
<!-- ЗАКРЫТИЕ form-container: теперь он охватывает ОБЕ вкладки целиком -->

<div class="btns">
  <button class="btn" id="bStart" onclick="start()">СТАРТ</button>
  <button class="btn" id="bLap" onclick="lap()">КРУГ</button>
  <button class="btn" id="bExport" onclick="exportRec()">ЭКСПОРТ</button>
  <button class="btn" id="bStop" onclick="stop()">СТОП</button>
</div>
<div id="status"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxtNHriDRJXNoNlRf3dqHTeI8klmNekkMNd4WOY0AFyvgZf48xeV3lfCyAAZv0aBZiAUA/exec';
function $(id) { return document.getElementById(id); }

var dict = { locked: false, points: [], operators: {}, inputs: [] };
var mode = 'krs';
var mainRun = false, mainStart = 0, mainFinal = null;
var lapRun = false, lapStart = 0, lapFinal = null;
var startLocal = null, lapLocal = null, stopLocal = null;
var stopClicks = [];
var lastMainText = null, lastLapText = null, lastLapVisible = null;
  
function nowStr(d) {
  function p(n) { return String(n).padStart(2, '0'); }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' '
       + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function fmt(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  function p(n) { return String(n).padStart(2, '0'); }
  return Math.floor(s / 3600) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
}
function status(t) { $('status').textContent = t; }

function setDisplays() {
  var mainText = mainRun ? fmt(Date.now() - mainStart)
                         : (mainFinal !== null ? fmt(mainFinal) : '0:00:00');
  if (mainText !== lastMainText) {
    $('main').textContent = mainText;
    lastMainText = mainText;
  }

  var showLap = mode === 'kat' && (lapRun || lapFinal !== null);
  
  if (showLap !== lastLapVisible) {
    $('lapWrap').style.visibility = showLap ? 'visible' : 'hidden';
    
    // ВОТ ОНА — НУЖНАЯ СТРОКА. Она добавляет класс .shrink главному таймеру
    $('main').classList.toggle('shrink', showLap); 
    
    lastLapVisible = showLap;
  }
  
  if (showLap) {
    var lapText = lapRun ? fmt(Date.now() - lapStart) : fmt(lapFinal);
    if (lapText !== lastLapText) {
      $('lap').textContent = lapText;
      lastLapText = lapText;
    }
  }
}
setInterval(setDisplays, 250);

function start() {
  if (dict.locked) return status('Записи заблокированы администратором');
  if (mainRun || mainFinal !== null) return;
  mainRun = true; mainStart = Date.now(); startLocal = nowStr(new Date());
  setDisplays();
}

function stop() {
  var t = Date.now();
  if (mainRun) { mainFinal = t - mainStart; mainRun = false; stopLocal = nowStr(new Date()); }
  if (lapRun)  { lapFinal = t - lapStart; lapRun = false; }
  stopClicks = stopClicks.filter(function (x) { return t - x < 3000; });
  stopClicks.push(t);
  if (stopClicks.length >= 3) { stopClicks = []; resetAll(); return status('Форма сброшена'); }
  setDisplays();
}

function lap() {
  if (mode !== 'kat' || !mainRun || lapRun) return;
  lapRun = true; lapStart = Date.now(); lapLocal = nowStr(new Date());
  setDisplays();
}

function switchMode(m) {
  if (m === mode) return;
  mode = m; resetAll();
  $('krsFields').style.display = m === 'krs' ? 'block' : 'none';
  $('katFields').style.display = m === 'kat' ? 'block' : 'none';
  $('tabKrs').classList.toggle('on', m === 'krs');
  $('tabKat').classList.toggle('on', m === 'kat');
}

function resetAll() {
  mainRun = false; lapRun = false; mainFinal = null; lapFinal = null;
  startLocal = null; lapLocal = null; stopLocal = null;
  ['entry','bib','point','kassa','kassCount','staff','queue','noteK','noteKt'].forEach(function (id) {
    var e = $(id); if (e) e.value = '';
  });
  document.querySelectorAll('[data-group] .tg').forEach(function (b) { b.classList.remove('on'); });
  $('chkPrint').classList.remove('on'); $('chkIssue').classList.remove('on');
  $('pointList').innerHTML = ''; $('point').classList.remove('err');
  $('latinHint').style.display = 'none';
  setDisplays();
}

/* ---------- ввод ---------- */
function digits(el, max) { el.value = el.value.replace(/\D/g, '').slice(0, max); }
function entryInput() {
  var d = $('entry').value.replace(/\D/g, '').slice(0, 16);
  $('entry').value = d ? 'G' + d : '';
}
function pointInput() {
  var v = $('point').value.toUpperCase();
  $('point').value = v;
  var latin = /^[A-Z0-9]*$/.test(v);
  $('point').classList.toggle('err', !latin);
  $('latinHint').style.display = latin ? 'none' : 'block';
  var q = $('pointList');
  q.innerHTML = '';
  if (!v || !latin) return;
  var m = (dict.points || []).filter(function (p) { return p.toUpperCase().indexOf(v) !== -1; }).slice(0, 8);
  m.forEach(function (p) {
    var d = document.createElement('div');
    d.textContent = p;
    d.onclick = function () { pickPoint(p); };
    q.appendChild(d);
  });
}
function pickPoint(p) {
  $('point').value = p; $('pointList').innerHTML = '';
  $('point').classList.remove('err'); $('latinHint').style.display = 'none';
}
function pick(el) {
  var group = el.parentElement.getAttribute('data-group');
  if (!group) {
    // группа не задана — ведём себя как раньше (для «Чеки»)
    el.classList.toggle('on');
    return;
  }
  var buttons = document.querySelectorAll('[data-group="' + group + '"] .tg');
  for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('on');
  el.classList.add('on');
}

function sel(g) {
  var wrap = document.querySelector('[data-group="' + g + '"]');
  if (!wrap) {
    console.warn('sel(): группа "' + g + '" не найдена в разметке');
    return '';
  }
  var b = wrap.querySelector('.on');
  return b ? b.getAttribute('data-val') : '';
}

/* ---------- экспорт ---------- */
function exportRec() {
  if (dict.locked) return status('Записи заблокированы администратором');
  if (mainRun || lapRun) return status('Сначала нажмите СТОП');
  if (mainFinal === null) return status('Нет замера для экспорта');

  var rec;
  if (mode === 'krs') {
    var entry = $('entry').value, bib = $('bib').value;
    var kontur = sel('kontur'), osmotr = sel('osmotr');
    if (!entry) return status('Заполните «Номер входной»');
    if (!dict.inputs || dict.inputs.indexOf(entry) === -1) return status('Номер «' + entry + '» отсутствует в списке входных');
    if (!bib) return status('Заполните «Номер манишки»');
    if (!kontur) return status('Выберите тип контура');
    if (!osmotr) return status('Выберите тип осмотра');
    rec = { mode: 'krs', entry: entry, kontur: kontur, osmotr: osmotr, bib: bib,
            durSec: Math.round(mainFinal / 1000), note: $('noteK').value, stopLocal: stopLocal };
  } else {
    var point = $('point').value, kassa = $('kassa').value;
    if (!point) return status('Заполните «Номер точки»');
    if (!/^[A-Z0-9]+$/.test(point)) return status('Используй латиницу!');
    if (!dict.points || dict.points.indexOf(point) === -1) return status('Точки «' + point + '» нет в списке точек');
    if (!kassa) return status('Заполните «Номер кассы»');
    var hadLap = lapFinal !== null;
    if (hadLap && !$('queue').value) return status('Заполните «Человек в очереди»');
    rec = { mode: 'katering', point: point, kassa: kassa,
            kassCount: $('kassCount').value, staff: $('staff').value, queue: $('queue').value,
            print: $('chkPrint').classList.contains('on'),
            issue: $('chkIssue').classList.contains('on'),
            note: $('noteKt').value, hadLap: hadLap, startLocal: startLocal, lapLocal: lapLocal,
            mainSec: Math.round(mainFinal / 1000),
            lapSec: hadLap ? Math.round(lapFinal / 1000) : null };
  }
  var q = getQ(); q.push(rec); saveQ(q);
  resetAll();
  status('Отправка…');
  sync();
}

/* ---------- очередь и синхронизация ---------- */
function getQ() { try { return JSON.parse(localStorage.getItem('zamer') || '[]'); } catch (e) { return []; } }
function saveQ(q) { localStorage.setItem('zamer', JSON.stringify(q)); }
var syncing = false;

function sync() {
  if (syncing || dict.locked) return;
  syncing = true;
  var rest = [];
  var chain = Promise.resolve();
  getQ().forEach(function (rec) {
    chain = chain.then(function () {
      return fetch(API, { method: 'POST', body: JSON.stringify(rec) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) { rest.push(rec); status(j.error || 'Ошибка отправки'); }
        });
    }).catch(function () { rest.push(rec); });
  });
  chain.catch(function () {}).then(function () {
    try {
      saveQ(rest);
      status(rest.length ? 'Не отправлено: ' + rest.length : 'Всё синхронизировано');
    } finally {
      syncing = false;
    }
  });
}
  
/* ---------- справочники и блокировка ---------- */
function loadDict() {
  fetch(API).then(function (r) { return r.json(); }).then(function (j) {
    dict = j;
    $('lockBar').style.display = dict.locked ? 'block' : 'none';
  }).catch(function () {});
}

window.addEventListener('online', sync);
setInterval(sync, 30000);
setInterval(loadDict, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
loadDict();
setDisplays();
</script>
</body>
</html>
