<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Замер</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:480px;background:#000;color:#fff;padding:10px 12px 92px;
     font-family:'Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',sans-serif}
.disp{font-size:64px;text-align:center;color:#0f0;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:8px}
.disp-lap{font-size:48px;text-align:center;color:#00c8ff;font-variant-numeric:tabular-nums;line-height:1.1}
.row-label{font-size:14px;margin:14px 2px 4px}
input,textarea{width:100%;background:#262626;color:#fff;border:0;border-radius:6px;padding:12px;
  font-size:14px;font-family:inherit;text-align:center}
textarea{text-align:left;resize:none}
input.err{background:#590d0b}
.hint{display:none;color:#ff6b6b;font-size:11px;margin-top:2px}
.suggest{max-height:150px;overflow:auto;border-radius:6px;margin-top:2px}
.suggest div{background:#262626;padding:10px;text-align:center;border-bottom:1px solid #000}
.toggles{display:flex;gap:8px}
.tg{flex:1;padding:12px 6px;background:#082626;color:#fff;border:0;border-radius:6px;font-size:12px;font-family:inherit}
.tg.on{background:#003c61}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{padding:26px 6px;border:0;border-radius:10px;font-size:20px;font-family:inherit}
#bStart{background:#132914;color:#0f0}
#bLap{background:#1e2b32;color:#00c8ff}
#bExport{background:#262626;color:#fff}
#bStop{background:#2c122a;color:#ff01ed}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:14px;background:#082626;color:#fff;border:0;font-size:16px;font-family:inherit}
.tab.on.krs{background:#003c61}
.tab.on.kat{background:#132914}
#lockBar{display:none;background:#590d0b;color:#fff;text-align:center;padding:8px;border-radius:6px;
  margin-bottom:8px;font-size:14px}
#status{text-align:center;color:#8a8a8a;font-size:13px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div id="lockBar">Записи заблокированы администратором</div>

<div id="main" class="disp">0:00:00</div>
<div id="lapWrap" style="display:none">
  <span class="row-label">Круг:</span>
  <div id="lap" class="disp-lap">0:00:00</div>
</div>

<!-- Поля режима КРС -->
<div id="krsFields">
  <div class="row-label">Номер входной</div>
  <input id="entry" inputmode="numeric" maxlength="17" oninput="entryInput()">
  <div class="row-label">Номер манишки</div>
  <input id="bib" inputmode="numeric" maxlength="4" oninput="digits(this,4)">
  <div class="row-label">Тип контура</div>
  <div class="toggles" data-group="kontur">
    <button class="tg" data-val="Теплый" onclick="pick(this)">Тёплый</button>
    <button class="tg" data-val="Холодный" onclick="pick(this)">Холод.</button>
  </div>
  <div class="row-label">Тип осмотра</div>
  <div class="toggles" data-group="osmotr">
    <button class="tg" data-val="Тело" onclick="pick(this)">Тело</button>
    <button class="tg" data-val="Ручная кладь" onclick="pick(this)">Кладь</button>
  </div>
  <div class="row-label">Примечание</div>
  <textarea id="noteK" rows="2" maxlength="300"></textarea>
</div>

<!-- Поля режима Кейтеринг -->
<div id="katFields" style="display:none">
  <div class="row-label">Номер точки</div>
  <input id="point" autocomplete="off" oninput="pointInput()">
  <div id="pointList" class="suggest"></div>
  <div class="hint" id="latinHint">Используй латиницу!</div>
  <div class="row-label">Номер кассы</div>
  <input id="kassa" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
  <div class="row-label">Количество работающих касс</div>
  <input id="kassCount" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
  <div class="row-label">Количество работающих персонала</div>
  <input id="staff" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
  <div class="row-label">Человек в очереди</div>
  <input id="queue" inputmode="numeric" maxlength="2" oninput="digits(this,2)">
  <div class="row-label">Чеки</div>
  <div class="toggles">
    <button class="tg" id="chkPrint" onclick="this.classList.toggle('on')">Печать</button>
    <button class="tg" id="chkIssue" onclick="this.classList.toggle('on')">Выдача</button>
  </div>
  <div class="row-label">Примечание</div>
  <textarea id="noteKt" rows="2" maxlength="400"></textarea>
</div>

<div class="btns">
  <button class="btn" id="bStart" onclick="start()">СТАРТ</button>
  <button class="btn" id="bLap" onclick="lap()">КРУГ</button>
  <button class="btn" id="bExport" onclick="exportRec()">ЭКСПОРТ</button>
  <button class="btn" id="bStop" onclick="stop()">СТОП</button>
</div>
<div id="status"></div>

<div class="tabs">
  <button class="tab on krs" id="tabKrs" onclick="switchMode('krs')">КРС</button>
  <button class="tab kat" id="tabKat" onclick="switchMode('kat')">КЕЙТЕРИНГ</button>
</div>

<script>
const API = https://script.google.com/macros/s/AKfycbxtNHriDRJXNoNlRf3dqHTeI8klmNekkMNd4WOY0AFyvgZf48xeV3lfCyAAZv0aBZiAUA/exec;
const $ = id => document.getElementById(id);

let dict = { locked: false, points: [], operators: {}, inputs: [] };
let mode = 'krs';
let mainRun = false, mainStart = 0, mainFinal = null;
let lapRun = false, lapStart = 0, lapFinal = null;
let startLocal = null, lapLocal = null, stopLocal = null;
let stopClicks = [];

const nowStr = d => {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' '
       + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
};
const fmt = ms => {
  const s = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, '0');
  return Math.floor(s / 3600) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
};
const status = t => $('status').textContent = t;

function setDisplays() {
  $('main').textContent = mainRun ? fmt(Date.now() - mainStart)
                        : (mainFinal != null ? fmt(mainFinal) : '0:00:00');
  const showLap = mode === 'kat' && (lapRun || lapFinal != null);
  $('lapWrap').style.display = showLap ? 'block' : 'none';
  if (showLap) $('lap').textContent = lapRun ? fmt(Date.now() - lapStart) : fmt(lapFinal);
}
setInterval(setDisplays, 250);

function start() {
  if (dict.locked) return status('Записи заблокированы администратором');
  if (mainRun || mainFinal != null) return; // неактивна до СТОП/сброса
  mainRun = true; mainStart = Date.now(); startLocal = nowStr(new Date());
  setDisplays();
}

function stop() {
  const t = Date.now();
  if (mainRun) { mainFinal = t - mainStart; mainRun = false; stopLocal = nowStr(new Date()); }
  if (lapRun)  { lapFinal = t - lapStart; lapRun = false; }
  stopClicks = stopClicks.filter(x => t - x < 3000).concat(t);
  if (stopClicks.length >= 3) { stopClicks = []; resetAll(); return status('Форма сброшена'); }
  setDisplays();
}

function lap() {
  if (mode !== 'kat' || !mainRun || lapRun) return;
  lapRun = true; lapStart = Date.now(); lapLocal = nowStr(new Date());
  setDisplays();
}

function switchMode(m) {
  if (m === mode) return;
  mode = m; resetAll();
  $('krsFields').style.display = m === 'krs' ? 'block' : 'none';
  $('katFields').style.display = m === 'kat' ? 'block' : 'none';
  $('tabKrs').classList.toggle('on', m === 'krs');
  $('tabKat').classList.toggle('on', m === 'kat');
}

function resetAll() {
  mainRun = lapRun = false; mainFinal = lapFinal = null;
  startLocal = lapLocal = stopLocal = null;
  ['entry','bib','point','kassa','kassCount','staff','queue','noteK','noteKt']
    .forEach(id => { const e = $(id); if (e) e.value = ''; });
  document.querySelectorAll('[data-group] .tg').forEach(b => b.classList.remove('on'));
  $('chkPrint').classList.remove('on'); $('chkIssue').classList.remove('on');
  $('pointList').innerHTML = ''; $('point').classList.remove('err');
  $('latinHint').style.display = 'none';
  setDisplays();
}

/* ---------- ввод ---------- */
function digits(el, max) { el.value = el.value.replace(/\D/g, '').slice(0, max); }
function entryInput() {
  const d = $('entry').value.replace(/\D/g, '').slice(0, 16);
  $('entry').value = d ? 'G' + d : '';
}
function pointInput() {
  const v = $('point').value.toUpperCase();
  $('point').value = v;
  const latin = /^[A-Z0-9]*$/.test(v);
  $('point').classList.toggle('err', !latin);
  $('latinHint').style.display = latin ? 'none' : 'block';
  const q = $('pointList');
  if (!v || !latin) { q.innerHTML = ''; return; }
  const m = dict.points.filter(p => p.toUpperCase().includes(v)).slice(0, 8);
  q.innerHTML = m.map(p => '<div onclick="pickPoint(\'' + p + '\')">' + p + '</div>').join('');
}
function pickPoint(p) {
  $('point').value = p; $('pointList').innerHTML = '';
  $('point').classList.remove('err'); $('latinHint').style.display = 'none';
}
function pick(el) {
  [...el.parentElement.children].forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}
const sel = g => {
  const b = document.querySelector('[data-group="' + g + '"] .on');
  return b ? b.dataset.val : '';
};

/* ---------- экспорт ---------- */
function exportRec() {
  if (dict.locked) return status('Записи заблокированы администратором');
  if (mainRun || lapRun) return status('Сначала нажмите СТОП');
  if (mainFinal == null) return status('Нет замера для экспорта');

  let rec;
  if (mode === 'krs') {
    const entry = $('entry').value, bib = $('bib').value;
    const kontur = sel('kontur'), osmotr = sel('osmotr');
    if (!entry) return status('Заполните «Номер входной»');
    if (!dict.inputs.includes(entry)) return status('Номер «' + entry + '» отсутствует в списке входных');
    if (!bib) return status('Заполните «Номер манишки»');
    if (!kontur) return status('Выберите тип контура');
    if (!osmotr) return status('Выберите тип осмотра');
    rec = { mode: 'krs', entry, kontur, osmotr, bib,
            durSec: Math.round(mainFinal / 1000), note: $('noteK').value, stopLocal };
  } else {
    const point = $('point').value, kassa = $('kassa').value;
    if (!point) return status('Заполните «Номер точки»');
    if (!/^[A-Z0-9]+$/.test(point)) return status('Используй латиницу!');
    if (!dict.points.includes(point)) return status('Точки «' + point + '» нет в списке точек');
    if (!kassa) return status('Заполните «Номер кассы»');
    const hadLap = lapFinal != null;
    if (hadLap && !$('staff').value) return status('Заполните «Количество работающих персонала»');
    rec = { mode: 'katering', point, kassa,
            kassCount: $('kassCount').value, staff: $('staff').value, queue: $('queue').value,
            print: $('chkPrint').classList.contains('on'),
            issue: $('chkIssue').classList.contains('on'),
            note: $('noteKt').value, hadLap, startLocal, lapLocal,
            mainSec: Math.round(mainFinal / 1000),
            lapSec: hadLap ? Math.round(lapFinal / 1000) : null };
  }
  const q = getQ(); q.push(rec); saveQ(q);
  resetAll();
  status('Отправка…');
  sync();
}

/* ---------- очередь и синхронизация ---------- */
const getQ  = () => JSON.parse(localStorage.getItem('zamer') || '[]');
const saveQ = q => localStorage.setItem('zamer', JSON.stringify(q));
let syncing = false;

async function sync() {
  if (syncing || dict.locked) return;
  syncing = true;
  const rest = [];
  for (const rec of getQ()) {
    try {
      const r = await fetch(API, { method: 'POST', body: JSON.stringify(rec) });
      const j = await r.json();
      if (!j.ok) { rest.push(rec); status(j.error || 'Ошибка отправки'); }
    } catch (e) { rest.push(rec); }
  }
  saveQ(rest);
  status(rest.length ? 'Не отправлено: ' + rest.length : 'Всё синхронизировано');
  syncing = false;
}

/* ---------- справочники и блокировка ---------- */
async function loadDict() {
  try {
    const r = await fetch(API);
    dict = await r.json();
    $('lockBar').style.display = dict.locked ? 'block' : 'none';
  } catch (e) {}
}

window.addEventListener('online', sync);
setInterval(sync, 30000);
setInterval(loadDict, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
loadDict(); setDisplays();
</script>
</body>
</html>
